<meta charset="utf-8">
<title>Rental Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — sticky top bar, one scrolling column of views, bottom tab bar on phones and a side rail from 900px. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #131a2a;
  --muted: #5b6577;
  --line: #dde2ea;
  --accent: #e2a12b;         /* road-marking amber */
  --accent-ink: #2a1d00;
  --navy: #1b2a4a;
  --navy-ink: #ffffff;
  --good: #1f8a5b;
  --good-bg: #e3f4ec;
  --warn: #b26b00;
  --warn-bg: #fdf1dc;
  --bad: #c2362f;
  --bad-bg: #fbe6e4;
  --odo-bg: #10151f;
  --odo-fg: #f2c46a;
  --shadow: 0 1px 2px rgba(19,26,42,.06), 0 6px 18px rgba(19,26,42,.06);
  --font-display: "Archivo", "Noto Sans Malayalam", "Malayalam Sangam MN", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", "Noto Sans Malayalam", "Malayalam Sangam MN", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121c; --surface: #161d2b; --surface-2: #1c2536; --ink: #e8ecf3; --muted: #97a1b3; --line: #2a3448;
    --accent: #f0b445; --accent-ink: #231800; --navy: #2b3f6b; --navy-ink: #ffffff;
    --good: #4cc48d; --good-bg: #16352a; --warn: #f0b445; --warn-bg: #3a2c10; --bad: #f07a72; --bad-bg: #3d1d1c;
    --odo-bg: #05080d; --odo-fg: #f2c46a; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121c; --surface: #161d2b; --surface-2: #1c2536; --ink: #e8ecf3; --muted: #97a1b3; --line: #2a3448;
  --accent: #f0b445; --accent-ink: #231800; --navy: #2b3f6b; --navy-ink: #ffffff;
  --good: #4cc48d; --good-bg: #16352a; --warn: #f0b445; --warn-bg: #3a2c10; --bad: #f07a72; --bad-bg: #3d1d1c;
  --odo-bg: #05080d; --odo-fg: #f2c46a; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 88%; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--navy-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-in { display: flex; align-items: center; gap: 12px; max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: block; flex: none; object-fit: cover; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.login-logo { width: 88px; height: 88px; border-radius: 50%; display: block; margin: 0 auto 4px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.brand h1 { font-size: 19px; font-weight: 800; font-stretch: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .spacer { flex: 1; }
.chip-user { display: flex; align-items: center; gap: 8px; font-size: 13px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px 10px 4px 4px; border: 0; color: inherit; }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.icon-btn { background: rgba(255,255,255,.1); border: 0; color: inherit; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
.save-chip { border: 0; border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.14); color: inherit; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lang-btn { background: rgba(255,255,255,.1); border: 0; color: inherit; min-width: 38px; height: 34px; padding: 0 8px; border-radius: 10px; font: 700 13px/1 var(--font-body); flex: none; }
html.ml .seg button { padding: 7px 10px; }
html.ml table.t th { white-space: normal; vertical-align: bottom; }
html.ml .row .title, html.ml .row .sub { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
html.ml .tab { font-size: 10.5px; letter-spacing: -.01em; line-height: 1.25; }
html.ml h1, html.ml h2, html.ml h3 { font-stretch: 100%; letter-spacing: 0; line-height: 1.35; }
html.ml .btn, html.ml button, html.ml .pill, html.ml .lbl, html.ml label { line-height: 1.35; }
.save-chip.err { background: var(--bad); color: #fff; }
.save-chip.ok { background: var(--good); color: #fff; }
.spin-dot { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
.pill.saving { background: var(--surface-2); color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .spin-dot { animation: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
.demo-bar { background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px; }

/* Shell */
.shell { max-width: 1180px; margin: 0 auto; display: flex; gap: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 110px; }
.rail { display: none; }
main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { background: none; border: 0; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--accent); }
.fab { position: fixed; z-index: 21; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 16px; height: 52px; padding: 0 18px 0 14px;
  display: flex; align-items: center; gap: 8px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
@media (min-width: 900px) {
  .tabs { display: none; }
  .rail { display: flex; flex-direction: column; gap: 4px; width: 200px; flex: none; position: sticky; top: 76px; align-self: flex-start; }
  .rail .tab { flex-direction: row; justify-content: flex-start; gap: 10px; font-size: 14px; padding: 10px 12px; border-radius: 10px; }
  .rail .tab[aria-current="page"] { background: var(--surface); box-shadow: var(--shadow); }
  .fab { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); right: calc(24px + env(safe-area-inset-right, 0px)); }
  .shell { padding-block: 24px 60px; }
}

/* Generic blocks */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h2 { font-size: 26px; font-weight: 800; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card h3 { font-size: 16px; font-weight: 700; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
@media (min-width: 720px) { .grid.two { grid-template-columns: 1fr 1fr; } .grid.three { grid-template-columns: repeat(3, 1fr); } }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; min-width: 0; }
.kpi .v { font-family: var(--font-display); font-stretch: 85%; font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpis-sm { margin-top: 10px; }
.kpis-sm .kpi .v { font-size: 18px; }
.period-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.period-bar > .field { width: 250px; max-width: 100%; }
.period-dates { flex: 1 1 280px; min-width: 0; }
.fleet-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
.fleet-strip div { background: var(--surface-2); border-radius: 10px; padding: 7px 4px; text-align: center; min-width: 0; }
.fleet-strip b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.fleet-strip span { display: block; font-size: 11px; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.fleet-strip .ws { background: var(--warn-bg); }
.fleet-strip .ws b, .fleet-strip .ws span { color: var(--warn); }
.kpi.hero { background: var(--navy); color: var(--navy-ink); }
.kpi.hero .l { color: rgba(255,255,255,.75); }
@media (min-width: 720px) { .kpi .v { font-size: 28px; } .kpi { padding: 16px; } }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
button.row:hover { background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.pos { color: var(--good); }
.amt.neg { color: var(--bad); }
.dot { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); }
.dot svg { width: 18px; height: 18px; }
.date-group { font-size: 12px; font-weight: 700; color: var(--muted); padding: 14px 0 4px; letter-spacing: .04em; text-transform: uppercase; }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.pill.out { background: var(--accent); color: var(--accent-ink); }

.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border-radius: 12px; padding: 3px; box-shadow: var(--shadow); max-width: 100%; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }

.btn { border: 0; border-radius: 11px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
a.btn { text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--navy); color: var(--navy-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Odometer: dark digit box, the one flourish */
.odo { display: inline-flex; gap: 2px; background: var(--odo-bg); padding: 4px 6px; border-radius: 6px; font-family: var(--font-mono); font-weight: 700; color: var(--odo-fg); font-size: 14px; letter-spacing: .04em; }
.odo span { background: rgba(255,255,255,.06); padding: 0 2px; border-radius: 2px; }
.odo.lg { font-size: 22px; padding: 6px 9px; }

/* Trip card */
.trip { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); text-align: left; border: 0; width: 100%; }
.trip .who { font-weight: 700; font-size: 16px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trip .meta { grid-column: 1 / -1; display: flex; gap: 8px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.trip-list { display: grid; gap: 10px; }
@media (min-width: 720px) { .trip-list { grid-template-columns: 1fr 1fr; } }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.stack { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; }
.stack > i { display: block; height: 100%; }

.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
.alert.bad { background: var(--bad-bg); }
.alert.warn { background: var(--warn-bg); }
.alert b { display: block; }
.alerts { display: grid; gap: 8px; }

.vehicle { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; }
.vphoto { width: 96px; height: 72px; border-radius: 10px; background: var(--surface-2); object-fit: cover; display: grid; place-items: center; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px 16px; }
.kv div { min-width: 0; }
.kv .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.kv .v { font-weight: 700; font-variant-numeric: tabular-nums; }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td.r, table.t th.r { text-align: right; }
.scroll-x { overflow-x: auto; }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }

/* Bottom sheet / dialog */
.scrim { position: fixed; inset: 0; background: rgba(8,12,20,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .22s ease-out; }
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 20px; max-height: 88vh; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .icon-btn.spin svg { animation: none; } }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 19px; flex: 1; min-width: 0; }
.sheet-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px; }
.sheet-foot .btn { flex: 1; }
.close { background: var(--surface-2); border: 0; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { display: block; width: 100%; max-width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 12px; font-size: 16px; min-height: 44px; }
/* iPhone date boxes refuse to shrink unless their native look is switched off. */
.field input[type="date"], .field input[type="datetime-local"], .field input[type="time"] { -webkit-appearance: none; appearance: none; text-align: left; line-height: 1.3; }
.field input::-webkit-date-and-time-value { text-align: left; }
.field input::-webkit-datetime-edit { padding: 0; }
.fields > * { min-width: 0; }
.fields { align-items: end; }
.dt-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; min-width: 0; }
.dt-date { position: relative; flex: 1 1 9em; min-width: 0; display: flex; }
.dt-date input[type="text"] { flex: 1; width: 100%; min-width: 0; padding-left: 10px; padding-right: 38px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.dt-date .cal-btn { position: absolute; right: 3px; top: 4px; bottom: 4px; width: 32px; border: 0; border-radius: 8px; background: var(--surface-2); }
.dt-row input.bad { border-color: var(--bad); }
.dt-row .dt-time { flex: 1 0 9.5em; width: auto; }
.cal-btn { position: relative; flex: none; width: 44px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink); overflow: hidden; }
.cal-btn .cal-native { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; margin: 0; min-height: 0; }
.field input[disabled], .field select[disabled], .field textarea[disabled] { opacity: 1; color: var(--ink); background: var(--surface-2); -webkit-text-fill-color: var(--ink); }
.field textarea { min-height: 70px; resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
@media (max-width: 340px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.fields .full { grid-column: 1 / -1; }
.fieldset { background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.fieldset > .eyebrow { margin-bottom: -2px; }
.fuel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.fuel button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 0; font-weight: 700; font-size: 13px; }
.fuel button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.fuel.rate3 { grid-template-columns: repeat(3, 1fr); }
.fuel.rate3 button[data-r="Good"][aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.fuel.rate3 button[data-r="Bad"][aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.sigpad { position: relative; border: 1.5px dashed var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
.sigpad canvas { display: block; width: 100%; height: 150px; touch-action: none; cursor: crosshair; }
.sig-hint { position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: #8a90a0; pointer-events: none; }
.sig-clear { position: absolute; right: 6px; top: 6px; }
.tg-steps { margin: 0 0 12px; padding-left: 20px; display: grid; gap: 4px; }
.tg-steps a { color: var(--ink); }
.tg-step { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tg-step > b { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: var(--navy-ink); display: grid; place-items: center; font-size: 13px; flex: none; }
.tg-step > span { flex: 1 1 140px; min-width: 0; }
.pdf-frame { width: 100%; height: 60vh; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.photos .ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); max-width: 100%; }
.photos .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .ph button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; line-height: 1; }
.add-photo { aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: 10px; display: grid; place-items: center; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; background: var(--surface); }
.add-photo input { display: none; }
.bill { background: var(--surface); border-radius: var(--r); padding: 14px; }
.bill .line { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-variant-numeric: tabular-nums; }
.bill .line.total { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; font-weight: 800; font-size: 17px; }
.suggest { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
.suggest button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.suggest button:last-child { border-bottom: 0; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.ph-wait { background: linear-gradient(90deg, var(--surface-2) 0%, var(--line) 50%, var(--surface-2) 100%) !important; background-size: 200% 100% !important; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .ph-wait { animation: none; } }
.gallery img, .gallery .ph-wait { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: var(--surface-2); display: block; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.9); display: grid; place-items: center; padding: 16px; }
.lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }

.toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.toast.err { background: var(--bad); color: #fff; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.splash { min-height: 60vh; display: grid; place-items: center; text-align: center; color: var(--muted); }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
</style>

/* ================= Business math (pure) ================= */
function ownership(vid) {
  var inv = T('Investments').filter(function (x) { return !vid || x['Vehicle ID'] === vid; });
  var total = sum(inv, function (x) { return x.Amount; }), out = {};
  partnerNames().forEach(function (p) { out[p] = 0; });
  inv.forEach(function (x) { out[x.Partner] = (out[x.Partner] || 0) + n(x.Amount); });
  Object.keys(out).forEach(function (p) { out[p] = total ? out[p] / total : 1 / Math.max(1, partnerNames().length); });
  return { shares: out, total: total };
}

function profitFor(filter) {
  var inc = sum(T('Payments').filter(filter), function (x) { return x.Amount; });
  var exp = sum(T('Expenses').filter(filter), function (x) { return x.Amount; });
  return { income: inc, expense: exp, profit: inc - exp };
}

function partnerSummary() {
  var names = partnerNames(), reserve = n(setting('Reserve %', 10)) / 100;
  var res = {};
  names.forEach(function (p) { res[p] = { partner: p, invested: 0, earned: 0, dividends: 0, cash: 0 }; });
  T('Investments').forEach(function (x) { if (res[x.Partner]) res[x.Partner].invested += n(x.Amount); });
  var vids = T('Vehicles').map(function (v) { return v['Vehicle ID']; });
  vids.forEach(function (vid) {
    var pr = profitFor(function (x) { return x['Vehicle ID'] === vid; }).profit, sh = ownership(vid).shares;
    names.forEach(function (p) { res[p].earned += pr * (sh[p] || 0); });
  });
  var general = profitFor(function (x) { return !x['Vehicle ID'] || vids.indexOf(x['Vehicle ID']) === -1; }).profit, all = ownership().shares;
  names.forEach(function (p) { res[p].earned += general * (all[p] || 0); });
  T('Dividends').forEach(function (d) { if (res[d.Partner]) res[d.Partner].dividends += n(d.Amount); });
  names.forEach(function (p) { var r = res[p]; r.afterReserve = r.earned * (1 - reserve); r.due = r.afterReserve - r.dividends; });
  // Cash in hand: what each partner collected minus what they paid out.
  var cash = cashLedger();
  names.forEach(function (p) { res[p].cash = cash[p] || 0; });
  return { list: names.map(function (p) { return res[p]; }), reserve: reserve, totalInvested: sum(names, function (p) { return res[p].invested; }) };
}

function cashLedger() {
  var c = {};
  function add(p, v) { if (!p) return; c[p] = (c[p] || 0) + n(v); }
  T('Payments').forEach(function (x) { if (x.Type !== 'From Deposit') add(x['Received By'], x.Amount); });
  T('Sales').forEach(function (x) { add(x['Received By'], x.Amount); });
  T('Trips').forEach(function (t) { if (n(t.Deposit)) { add(t['Deposit Held By'], t.Deposit); add(t['Deposit Held By'], -n(t['Deposit Refunded'])); } });
  T('Expenses').forEach(function (x) { add(x['Paid By'], -n(x.Amount)); });
  T('Dividends').forEach(function (x) { add(x['Paid By'], -n(x.Amount)); });
  T('Transfers').forEach(function (x) { add(x.From, -n(x.Amount)); add(x.To, x.Amount); });
  return c;
}

function money2(v) { var x = Math.round(n(v) * 100) / 100; return (x < 0 ? '−' : '') + '₹' + Math.abs(x).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function r2(v) { return Math.round(n(v) * 100) / 100; }

/** Settle up: share all business cash by ownership. settle > 0 receives, settle < 0 pays. */
function settlement() {
  var names = partnerNames(), cash = cashLedger(), own = ownership().shares;
  var pool = sum(names, function (p) { return cash[p] || 0; });
  var rows = names.map(function (p) {
    var hold = r2(cash[p] || 0), share = r2(pool * (own[p] || 0));
    return { partner: p, hold: hold, share: share, settle: r2(share - hold) };
  });
  // Put any rounding difference on the largest payer so the total is exactly zero.
  var diff = r2(sum(rows, function (r) { return r.settle; }));
  if (diff && rows.length) { var big = rows.slice().sort(function (a, b) { return a.settle - b.settle; })[0]; big.settle = r2(big.settle - diff); big.share = r2(big.share - diff); }
  return { pool: r2(pool), rows: rows };
}

/** Records that empty everyone's cash: reimbursements as handovers, profit as dividends. */
function payoutPlan() {
  var st = settlement(), plan = [];
  var payers = st.rows.filter(function (r) { return r.settle < 0; }).map(function (r) { return { p: r.partner, left: -r.settle }; });
  st.rows.forEach(function (r) {
    if (r.hold > 0 && r.settle < 0 && r.share > 0) plan.push({ kind: 'dividend', to: r.partner, from: r.partner, amount: r.share });
    if (r.hold > 0 && r.settle >= 0 && r.hold > 0) plan.push({ kind: 'dividend', to: r.partner, from: r.partner, amount: Math.min(r.hold, r.share) });
  });
  st.rows.filter(function (r) { return r.settle > 0; }).forEach(function (r) {
    var reimb = Math.max(0, -r.hold), div = r.settle - reimb;
    [['transfer', reimb], ['dividend', div]].forEach(function (part) {
      var need = r2(part[1]);
      while (need > 0.004 && payers.length) {
        var py = payers[0], amt = r2(Math.min(need, py.left));
        plan.push({ kind: part[0], to: r.partner, from: py.p, amount: amt });
        need = r2(need - amt); py.left = r2(py.left - amt);
        if (py.left <= 0.004) payers.shift();
      }
    });
  });
  return plan.filter(function (x) { return x.amount > 0.004; });
}

function monthly(nMonths) {
  var now = new Date(), keys = [];
  for (var i = nMonths - 1; i >= 0; i--) { var d = new Date(now.getFullYear(), now.getMonth() - i, 1); keys.push(d.getFullYear() + '-' + pad(d.getMonth() + 1)); }
  return keys.map(function (k) {
    return { key: k,
      income: sum(T('Payments').filter(function (x) { return monthKey(x.Date) === k; }), function (x) { return x.Amount; }),
      expense: sum(T('Expenses').filter(function (x) { return monthKey(x.Date) === k; }), function (x) { return x.Amount; }) };
  });
}

function utilization(vid, days) {
  var now = new Date(), from = new Date(now - days * DAY), used = 0;
  T('Trips').forEach(function (t) {
    if (t['Vehicle ID'] !== vid) return;
    var a = parseD(t['Out At']), b = t.Status === 'Out' ? now : parseD(t['In At']);
    if (!a || !b) return;
    var s = Math.max(a, from), e = Math.min(b, now);
    if (e > s) used += (e - s) / DAY;
  });
  return Math.min(1, used / days);
}

/* ---------- Period picker ---------- */
var PERIODS = [['month', 'This month'], ['lastmonth', 'Last month'], ['3m', 'Last 3 months'], ['year', 'This year'], ['all', 'All time'], ['custom', 'Choose dates']];
/** The Home period as inclusive yyyy-mm-dd dates; null means all time. */
function periodRange() {
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  var first = function (yy, mm) { return isoDate(new Date(yy, mm, 1)); }, last = function (yy, mm) { return isoDate(new Date(yy, mm + 1, 0)); };
  switch (S.period) {
    case 'lastmonth': return { from: first(y, m - 1), to: last(y, m - 1) };
    case '3m': return { from: first(y, m - 2), to: last(y, m) };
    case 'year': return { from: y + '-01-01', to: y + '-12-31' };
    case 'all': return null;
    case 'custom': return S.pFrom && S.pTo ? { from: S.pFrom <= S.pTo ? S.pFrom : S.pTo, to: S.pFrom <= S.pTo ? S.pTo : S.pFrom } : { from: first(y, m), to: last(y, m) };
    default: return { from: first(y, m), to: last(y, m) };
  }
}
function inPeriod(d, r) { if (!r) return true; var k = String(d || '').slice(0, 10); return !!k && k >= r.from && k <= r.to; }
function periodLabel(r) {
  if (!r) return 'All time';
  var a = parseD(r.from), b = parseD(r.to);
  if (r.from.slice(8) === '01' && isoDate(new Date(b.getFullYear(), b.getMonth() + 1, 0)) === r.to) {
    if (r.from.slice(0, 7) === r.to.slice(0, 7)) return MONTHS[a.getMonth()] + ' ' + a.getFullYear();
    return MONTHS[a.getMonth()] + (a.getFullYear() !== b.getFullYear() ? ' ' + a.getFullYear() : '') + ' – ' + MONTHS[b.getMonth()] + ' ' + b.getFullYear();
  }
  return fDate(r.from) + ' – ' + fDate(r.to);
}
/** Days each trip was on the road inside the period (open trips count up to now). */
function rentedDays(r) {
  var a = r ? parseD(r.from).getTime() : -Infinity, b = r ? parseD(r.to).getTime() + DAY : Date.now(), now = Date.now(), d = 0;
  T('Trips').forEach(function (t) {
    if (t.Status !== 'Out' && t.Status !== 'Returned') return;
    var s = parseD(t['Out At']), e = t.Status === 'Out' ? new Date(now) : parseD(t['In At']); if (!s || !e) return;
    var lo = Math.max(s.getTime(), a), hi = Math.min(e.getTime(), b); if (hi > lo) d += (hi - lo) / DAY;
  });
  return Math.round(d);
}

function chart(rows) {
  var W = 340, H = 170, L = 40, B = 24, top = 10;
  var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r.income, r.expense); }).concat([1000]));
  var step = Math.pow(10, Math.floor(Math.log10(max))); var nice = Math.ceil(max / step) * step; if (nice / step > 6) nice = Math.ceil(max / (step * 2)) * step * 2;
  var y = function (v) { return top + (H - top - B) * (1 - v / nice); };
  var gw = (W - L) / rows.length, bw = Math.min(16, gw / 3);
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Income and expenses by month">';
  [0, .5, 1].forEach(function (f) { var v = nice * f; s += '<line x1="' + L + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + shortMoney(v) + '</text>'; });
  rows.forEach(function (r, i) {
    var cx = L + gw * i + gw / 2;
    s += '<rect x="' + (cx - bw - 1) + '" y="' + y(r.income) + '" width="' + bw + '" height="' + (y(0) - y(r.income)) + '" rx="3" fill="var(--accent)"><title>' + monthLabel(r.key) + ' income ' + money(r.income) + '</title></rect>';
    s += '<rect x="' + (cx + 1) + '" y="' + y(r.expense) + '" width="' + bw + '" height="' + (y(0) - y(r.expense)) + '" rx="3" fill="var(--navy)"><title>' + monthLabel(r.key) + ' expenses ' + money(r.expense) + '</title></rect>';
    s += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + MONTHS[+r.key.slice(5) - 1] + '</text>';
  });
  return s + '</svg>';
}

/** Status of a paper or service: by date, by km, or both (whichever is sooner). */
function docStatus(d) {

  var isService = /service|oil|tyre/i.test(d.Item || '');
  if (days === null && left === null) return { lvl: 'done', pill: '<span class="pill neutral">' + (isService ? 'Done' : 'No date') + '</span>', when: d.Notes ? String(d.Notes).split(' · ')[0] : '' };
  var whenTxt = [left !== null ? due.toLocaleString('en-IN') + ' km' : '', exp ? fDate(d['Expiry Date']) : ''].filter(Boolean).join(' or ');
  var over = (days !== null && days < 0) || (left !== null && left <= 0);

var photoCache = window.__photoCache || {}, photoWaiting = {};
/** Fetch preview photos, 4 per request, up to 3 requests at a time. Resolves when all are in the cache. */
function fetchPhotos(ids) {
  var need = ids.filter(function (id, i) { return id && !photoCache[id] && !photoWaiting[id] && ids.indexOf(id) === i; });
  if (!need.length) return Promise.all(ids.map(function (id) { return photoWaiting[id] || null; }));
  var chunks = []; for (var i = 0; i < need.length; i += 4) chunks.push(need.slice(i, i + 4));
  var running = 0, queue = chunks.slice(), done;
  var all = new Promise(function (res) { done = res; });
  function next() {
    if (!queue.length) { if (!running) done(); return; }
    var ch = queue.shift(); running++;
    var pr = call('photos', { ids: ch }).then(function (list) { list.forEach(function (p) { if (p.src) photoCache[p.id] = p.src; }); })
      .catch(function () {}).then(function () { ch.forEach(function (id) { delete photoWaiting[id]; }); running--; paintPhotos(); next(); });
    ch.forEach(function (id) { photoWaiting[id] = pr; });
  }
  for (var k = 0; k < 3; k++) next();
  return all;
}
/** Swap every waiting placeholder on screen for its photo once it is in the cache. */
function paintPhotos() {
  document.querySelectorAll('[data-pid]').forEach(function (e) {
    var id = e.getAttribute('data-pid'), src = photoCache[id];

    img.setAttribute('data-act', 'zoom'); img.setAttribute('data-pid', id); e.replaceWith(img);
  });
  document.querySelectorAll('.vphoto[data-photo]').forEach(function (b) { var src = photoCache[b.getAttribute('data-photo')]; if (src && b.tagName !== 'IMG') b.outerHTML = '<img class="vphoto" alt="Car photo" src="' + src + '">'; });
}
function loadPhotos(container) {
  if (!container) return;
  var ids = Array.prototype.map.call(container.querySelectorAll('[data-pid]'), function (e) { return e.getAttribute('data-pid'); });
  paintPhotos(); fetchPhotos(ids);
}

function initSigPad() {

  var r = c.getBoundingClientRect(), ratio = Math.min(2, window.devicePixelRatio || 1);

  c.addEventListener('pointerdown', function (e) { e.preventDefault(); down = true; last = pt(e); try { c.setPointerCapture(e.pointerId); } catch (x) {} ctx.beginPath(); ctx.arc(last.x, last.y, 1, 0, 7); ctx.fill(); });
  c.addEventListener('pointermove', function (e) { if (!down) return; e.preventDefault(); var p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; if (!M.sig.drawn) { M.sig.drawn = true; var h = document.getElementById('sigHint'); if (h) h.hidden = true; } });

}

/** Wait until this trip has reached the sheet (saving runs in the background). */
function waitSaved(id) {
  return new Promise(function (res, rej) {
    var tries = 0;
    (function check() {
      if (qFailed.some(function (j) { return (j.payload || {}).tripId === id; })) return rej(new Error('The trip did not save, so the agreement cannot be made yet.'));
      var t = get('Trips', id);
      if (t && !isPending(t) && !Q.length) return res(t);
      if (++tries > 120) return rej(new Error('Still saving. Try again in a minute.'));
      setTimeout(check, 500);
    })();
  });
}
